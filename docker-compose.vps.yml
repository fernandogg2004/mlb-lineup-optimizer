# =============================================================================
# docker-compose.vps.yml — Stack MLB AI para VPS Linux (producción)
#
# Combina la API de inferencia + Airflow en un único compose.
# Todos los servicios están en la red mlb_net y se reinician automáticamente.
#
# Arranque inicial:  bash deploy/first_run.sh
# Actualizaciones:   bash deploy/update.sh
# =============================================================================

# ---------------------------------------------------------------------------
# Ancla común para todos los servicios de Airflow
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW_FERNET_KEY}'
    AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_SECRET_KEY}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '30'
    # Variables de negocio
    POSTGRES_HOST: postgres-mlb
    POSTGRES_PORT: '5432'
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    MLB_OPTIMIZER_API_URL: http://mlb_api:8000
    MLB_STATS_API_BASE: https://statsapi.mlb.com/api/v1
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-mlb-ai-datalake}
    PYTHONPATH: /opt/airflow
    # Shared persistence (MLflow + Gold Parquet + A/B store)
    MLFLOW_TRACKING_URI: /opt/mlruns
    EXPERIMENT_STORE_PATH: /opt/airflow/data/gold/ab_experiment
    FEEDBACK_STORE_PATH: /opt/airflow/data/gold/qualitative_feedback
    GOLD_PA_PATH: /opt/airflow/data/gold/plate_appearances
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./reports:/opt/airflow/reports
    - ./mlruns:/opt/mlruns
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - mlb_net
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-mlb:
      condition: service_healthy

# ---------------------------------------------------------------------------
networks:
  mlb_net:
    driver: bridge

volumes:
  postgres-airflow-db:
  postgres-mlb-db:

# ---------------------------------------------------------------------------
services:

  # ── API de inferencia ─────────────────────────────────────────────────────
  mlb_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlb-optimizer:latest
    container_name: mlb_api
    restart: unless-stopped
    environment:
      AT_BAT_MODEL_PATH: /models/at_bat_predictor.pkl
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
      FEEDBACK_STORE_PATH: /opt/app-data/gold/qualitative_feedback
      EXPERIMENT_STORE_PATH: /opt/app-data/gold/ab_experiment
      MLFLOW_TRACKING_URI: /opt/mlruns
      PORT: '8000'
      # PostgreSQL — dashboard read endpoints
      POSTGRES_HOST: postgres-mlb
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./models:/models:ro
      - ./mlruns:/opt/mlruns
      - ./data:/opt/app-data
    ports:
      - "8000:8000"
    depends_on:
      postgres-mlb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mlb_net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── PostgreSQL (metadata de Airflow) ──────────────────────────────────────
  postgres-airflow:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlb_net

  # ── PostgreSQL (predicciones MLB) ─────────────────────────────────────────
  postgres-mlb:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-mlb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlb_net

  # ── Airflow webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Airflow scheduler ─────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  # ── Airflow init (se ejecuta una vez y termina) ───────────────────────────
  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password ${AIRFLOW_ADMIN_PASSWORD}
          --firstname MLB
          --lastname Admin
          --role Admin
          --email ${AIRFLOW_ADMIN_EMAIL}
      "
