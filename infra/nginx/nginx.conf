# nginx.conf — Reverse proxy con rate limiting y SSL termination
worker_processes auto;
events { worker_connections 1024; }

http {
    # Rate limiting: 60 req/min por IP para la API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Logging estructurado
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json_combined;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        # Security headers
        add_header X-Content-Type-Options   nosniff;
        add_header X-Frame-Options          DENY;
        add_header X-XSS-Protection         "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # API
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Healthcheck (sin rate limit, sin auth — para el ALB)
        location /health {
            proxy_pass http://api:8000/health;
        }

        # Grafana (solo accesible internamente o con IP whitelist)
        location /grafana/ {
            allow  10.0.0.0/8;    # solo red interna
            deny   all;
            proxy_pass http://grafana:3000/;
        }

        # Prometheus (nunca exponer públicamente)
        location /metrics { deny all; }
    }
}
