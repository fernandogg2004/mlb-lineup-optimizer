# alert_rules.yml — Reglas de alerta Prometheus para MLB AI
groups:
  - name: mlb_api_alerts
    rules:

      # API caída por más de 2 minutos
      - alert: APIDown
        expr: up{job="mlb_api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MLB AI API está caída"
          description: "El endpoint de inferencia no responde hace {{ $value }} segundos."

      # Latencia P95 > 5 segundos
      - alert: HighInferenceLatency
        expr: >
          histogram_quantile(0.95,
            rate(mlb_inference_latency_seconds_bucket{endpoint="/v1/predict/all"}[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia de inferencia alta (P95 > 5s)"
          description: "P95 actual: {{ $value }}s en el endpoint /v1/predict/all."

      # Tasa de errores > 5% en 5 minutos
      - alert: HighErrorRate
        expr: >
          rate(mlb_inference_errors_total[5m]) /
          rate(mlb_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de errores de inferencia > 5%"
          description: "Error rate actual: {{ $value | humanizePercentage }}."

      # Drift PSI crítico (calculado por el DAG diario)
      - alert: ModelDriftCritical
        expr: mlb_drift_psi_total > 0.20
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Data drift crítico detectado (PSI > 0.20)"
          description: "PSI total: {{ $value }}. El modelo puede necesitar reentrenamiento."

      # Drift PSI warning
      - alert: ModelDriftWarning
        expr: mlb_drift_psi_total > 0.10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Data drift warning detectado (PSI > 0.10)"
          description: "PSI total: {{ $value }}. Monitorear de cerca."

      # PostgreSQL caído
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL no responde"
          description: "La base de datos de predicciones está inaccesible."

  - name: mlb_model_alerts
    rules:

      # Distribución de HRs fuera de rango (posible data quality issue)
      - alert: HRRateAnomaly
        expr: >
          histogram_quantile(0.50,
            rate(mlb_prediction_probability_bucket{outcome_class="HR"}[1h])
          ) > 0.12
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de HR predicha anormalmente alta"
          description: "Mediana de prob_hr > 12% en la última hora. Revisar input data."

      # Demasiados bateadores 'nuevos' sin historial (rookies o data gap)
      - alert: HighNewBatterRatio
        expr: >
          mlb_active_batters_today == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No se procesaron bateadores en la última predicción"
          description: "El gauge de bateadores activos es 0 tras /predict/all."
